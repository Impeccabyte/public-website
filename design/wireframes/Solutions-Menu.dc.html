<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Solutions mega menu open</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/impeccabytedesignsystem_14a6d0/tokens.css">
<link rel="stylesheet" href="ds/impeccabytedesignsystem_14a6d0/components/bundle.css">
<script src="ds/impeccabytedesignsystem_14a6d0/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0;background:#FAF6EF}</style>
</helmet>
<div style="position: relative; background: var(--paper); min-height: 960px; font-family: var(--font-sans); overflow: hidden;">
<dc-import name="Header" annotations="{{ann}}" mega="solutions" active="solutions" hint-size="100%,76px"></dc-import>
<div aria-hidden="true" style="max-width: 1240px; margin: 0 auto; padding: 88px 24px; display: flex; flex-wrap: wrap; gap: 56px;">
<div style="flex: 1 1 460px; display: flex; flex-direction: column; gap: 24px;">
<div class="ib-eyebrow">Austin merchant services</div>
<div style="font-family: var(--font-display); font-weight: 600; font-size: 62px; line-height: 1.05; letter-spacing: -0.025em; color: var(--ink-900);">Getting paid should feel <em style="font-weight: 500; color: var(--clay-500);">impeccably</em> easy.</div>
<div style="height: 18px; width: 90%; background: var(--ink-100); border-radius: 6px;"></div>
<div style="height: 18px; width: 70%; background: var(--ink-100); border-radius: 6px;"></div>
</div>
<div style="flex: 1 1 460px; height: 420px; background: var(--white); border: 1px solid var(--ink-200); border-radius: 20px;"></div>
</div>
<div style="position: absolute; inset: 76px 0 0 0; background: rgba(42,33,26,0.32); z-index: 10;"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"annotations":{"editor":"boolean","default":true},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  renderVals() { return { ann: this.props.annotations !== false }; }
}
</script>
</body>
</html>
