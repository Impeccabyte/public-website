uuid: 6f320a68-aea7-49ae-9e1f-d7ad8c03067f
langcode: en
status: open
dependencies:
  module:
    - impeccabyte_site
third_party_settings:
  impeccabyte_site:
    meta_description: 'Tell us about your business and how you take payments, and a local specialist will put together your quote. A quote is just a quote, and we never sell your info.'
weight: 0
open: null
close: null
uid: 0
template: false
archive: false
id: get_a_quote
title: 'Get a quote'
description: 'The three-step quote request.'
categories: {  }
elements: |
  business:
    '#type': webform_wizard_page
    '#title': 'Business info'
    business_heading:
      '#type': webform_markup
      '#markup': '<h2 class="quote-step__title">Your business</h2>'
    business_fields:
      '#type': container
      '#attributes':
        class:
          - form-grid
      business_name:
        '#type': textfield
        '#title': 'Business name'
        '#placeholder': 'Reyes Barbershop'
        '#required': true
        '#attributes':
          autocomplete: organization
      business_type:
        '#type': select
        '#title': 'Type of business'
        '#empty_option': 'Choose one'
        '#options':
          restaurant: 'Restaurants & Bars'
          food_truck: 'Food Trucks'
          retail: Retail
          salon: 'Salons & Spas'
          home_services: 'Home Services'
          healthcare: 'Healthcare & Dental'
          auto: 'Auto Repair'
          professional: 'Professional Services'
          nonprofit: Nonprofits
          other: 'Something else'
      time_open:
        '#type': select
        '#title': 'How long have you been open?'
        '#empty_option': 'Choose one'
        '#options':
          not_open: 'Not open yet'
          under_1: 'Less than a year'
          1_to_3: '1 to 3 years'
          over_3: 'More than 3 years'
      zip:
        '#type': textfield
        '#title': 'ZIP code'
        '#placeholder': '78704'
        '#description': 'Helps us match you with a local specialist'
        '#description_display': before
        '#maxlength': 10
        '#pattern': '[0-9]{5}(-[0-9]{4})?'
        '#pattern_error': 'Enter a 5-digit ZIP code, for example 78704.'
        '#attributes':
          autocomplete: postal-code
          inputmode: numeric
      monthly_volume:
        '#type': select
        '#title': 'Monthly card sales, roughly'
        '#empty_option': 'Choose one'
        '#options':
          none: 'Not taking cards yet'
          under_10k: 'Under $10,000'
          10k_to_50k: '$10,000 to $50,000'
          50k_to_150k: '$50,000 to $150,000'
          over_150k: 'Over $150,000'
  payments:
    '#type': webform_wizard_page
    '#title': 'How you take payments'
    payments_heading:
      '#type': webform_markup
      '#markup': '<h2 class="quote-step__title">How you take payments</h2>'
    channels:
      '#type': checkboxes
      '#title': 'Where do you take payments?'
      '#description': 'Choose all that apply.'
      '#description_display': before
      '#options':
        store: 'In a store or counter -- Customers pay in person'
        online: 'Online -- Website, links or invoices'
        go: 'On the go -- Markets, events, job sites'
        recurring: 'Recurring billing -- Memberships or retainers'
      '#options_description_display': description
      '#wrapper_attributes':
        class:
          - option-cards
    current_processor:
      '#type': select
      '#title': 'Who processes your cards today?'
      '#empty_option': 'Choose one'
      '#options':
        square: Square
        stripe: Stripe
        clover_bank: 'Clover through my bank'
        toast: Toast
        other: 'Another provider'
        none: 'Not taking cards yet'
    interests:
      '#type': checkboxes
      '#title': 'Also interested in'
      '#options':
        dual_pricing: 'Dual pricing'
        hardware: 'New hardware'
        chargeback: 'Chargeback protection'
      '#default_value':
        - dual_pricing
      '#wrapper_attributes':
        class:
          - inline-checks
  contact:
    '#type': webform_wizard_page
    '#title': Contact
    contact_heading:
      '#type': webform_markup
      '#markup': '<h2 class="quote-step__title">How to reach you</h2>'
    contact_fields:
      '#type': container
      '#attributes':
        class:
          - form-grid
      first_name:
        '#type': textfield
        '#title': 'First name'
        '#placeholder': Jordan
        '#required': true
        '#attributes':
          autocomplete: given-name
      last_name:
        '#type': textfield
        '#title': 'Last name'
        '#placeholder': Reyes
        '#required': true
        '#attributes':
          autocomplete: family-name
      email:
        '#type': email
        '#title': Email
        '#placeholder': you@yourbusiness.com
        '#required': true
        '#attributes':
          autocomplete: email
      mobile_phone:
        '#type': tel
        '#title': 'Mobile phone'
        '#placeholder': '(512) 555-0123'
        '#attributes':
          autocomplete: tel
    contact_method:
      '#type': radios
      '#title': 'Best way to reach you'
      '#options':
        text: Text
        call: Call
        email: Email
      '#default_value': text
      '#wrapper_attributes':
        class:
          - pill-radios
    consent:
      '#type': checkbox
      '#title': "It's okay to contact me about my quote"
      '#description': 'We never sell your information. Message and data rates may apply for texts.'
      '#required': true
      '#required_error': 'Please check the box so we can send your quote.'
  device:
    '#type': hidden
    '#title': 'Device asked about'
    '#prepopulate': true
  actions:
    '#type': webform_actions
    '#title': 'Submit button'
    '#submit__label': 'Send my quote request'
    '#submit__attributes':
      class:
        - button--lg
    '#wizard_prev__attributes':
      class:
        - button--lg
    '#wizard_next__attributes':
      class:
        - button--lg
