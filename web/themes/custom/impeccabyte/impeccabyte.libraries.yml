global:
  version: 1.x
  css:
    base:
      css/tokens.css: {}
      css/base.css: {}
    component:
      css/forms.css: {}
      css/a11y.css: {}
      css/compare.css: {}
      css/catalog.css: {}
  js:
    js/catalog.js: {}
  dependencies:
    - core/drupal
    - core/once
    # The compare page's table and price placeholders come from a module
    # template, so their component styles load everywhere.
    - core/components.impeccabyte--comparison-table
    - core/components.impeccabyte--price
    - core/components.impeccabyte--button

# Self-hosted fonts (fonts/ and css/fonts.css), so no visitor request goes
# to Google.
fonts:
  version: 1.x
  css:
    base:
      css/fonts.css: {}
