name: Callout
description: 'A boxed note. The icon and title carry the meaning along with the color.'
props:
  type: object
  properties:
    variant: { title: 'info, success, warning, danger or brand' }
    title: { title: 'Optional title' }
    body: { title: 'Body text or markup' }
    heading_level: { title: 'Heading level of the title, 3 by default' }
slots:
  content: { title: 'Body, used in place of the body prop' }
