name: Tabs
description: 'Pill or underline tabs with arrow-key support.'
# Props, all optional unless the template needs them. They are documented
# here instead of in a schema because most take values of more than one type
# (a string or nothing, a list or a rendered element).
#   id: Unique id prefix
#   label: Accessible name of the tab list
#   variant: pill or underline
#   tabs: List of {label, content}
libraryOverrides:
  dependencies:
    - core/drupal
    - core/once
