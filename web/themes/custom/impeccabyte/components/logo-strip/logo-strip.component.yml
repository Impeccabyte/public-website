name: Logo strip
description: 'A row of partner names or logos.'
# Props, all optional unless the template needs them. They are documented
# here instead of in a schema because most take values of more than one type
# (a string or nothing, a list or a rendered element).
#   id: Section id
#   intro: Intro text
#   names: Names shown as text
#   logos: Images {url, alt, width, height}, each drawn as a mask in one ink tone
#   layout: strip or tiles
#   anchor: Anchor id, tiles layout
#   eyebrow, heading, body: Section header, tiles layout
#   title, note: Text tile after the logos, tiles layout
#   footnote: Small print under the tiles
libraryOverrides:
  dependencies:
    - core/components.impeccabyte--section-header
