name: Resource page
description: 'A single resource: breadcrumb, title, summary, body and an optional download.'
# Props, all optional unless the template needs them. They are documented
# here instead of in a schema because most take values of more than one type
# (a string or nothing, a list or a rendered element).
#   title: Title
#   breadcrumb: Breadcrumb items
#   type: Resource type name
#   topic: Topic name
#   summary: Summary
#   meta: Read time or format
#   updated: Updated date
#   body: Rendered body
#   file: Download {url, label, size, mime}
#   placeholder: Marks a story that is not real yet
#   quote_url: Quote form path
libraryOverrides:
  dependencies:
    - core/components.impeccabyte--badge
    - core/components.impeccabyte--button
