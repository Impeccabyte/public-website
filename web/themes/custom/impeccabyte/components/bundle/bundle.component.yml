name: Recommended setup
description: 'Devices and solutions that work together, with add-ons and a monthly hardware estimate.'
# Props, all optional unless the template needs them. They are documented
# here instead of in a schema because most take values of more than one type
# (a string or nothing, a list or a rendered element).
#   id: Section id
#   anchor: Anchor id
#   eyebrow: Eyebrow
#   heading: Heading
#   intro: Intro
#   items: Items {label, name, url, note, quantity, line_total, bundle}
#   addons: Add-on labels
#   total: Formatted monthly total
#   buy_total: Formatted buy total
#   note: Estimate note
#   link: Link {url, title}
#   show_prices: Whether prices are shown
#   price_placeholder: Placeholder text
#   quote_url: Quote form path
libraryOverrides:
  dependencies:
    - core/components.impeccabyte--card
    - core/components.impeccabyte--price
    - core/components.impeccabyte--badge
#   has_hardware: Whether any line is hardware; without it the panel is a quote prompt
