name: Industry picker
description: 'Chips that switch between industries; each shows its pitch and a typical setup.'
props:
  type: object
  properties:
    id: { title: 'Section id' }
    eyebrow: { title: 'Eyebrow' }
    heading: { title: 'Heading' }
    items: { title: 'Industries {industry, title, body, link, items: setup lines}' }
