name: Comparison table
description: 'A table that scrolls inside its own box on small screens.'
# Props, all optional unless the template needs them. They are documented
# here instead of in a schema because most take values of more than one type
# (a string or nothing, a list or a rendered element).
#   id: Section id
#   eyebrow: Eyebrow
#   heading: Heading
#   intro: Intro under the heading
#   footnote: Small print under the table
#   columns: Column headers
#   highlight_column: Number of the highlighted column, from 1
#   items: Rows {label, cells, is_price}
#   show_prices: Whether prices are shown
#   price_placeholder: Placeholder text
#   quote_url: Quote form path
