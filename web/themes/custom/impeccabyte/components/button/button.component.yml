name: Button
description: 'A full pill button. Renders as a link when it has an href, otherwise as a button.'
# Props, all optional unless the template needs them. They are documented
# here instead of in a schema because most take values of more than one type
# (a string or nothing, a list or a rendered element).
#   label: Label, starting with a verb
#   href: Link target. Leave empty for a button element.
#   variant: primary, secondary, ghost, accent, danger or on-dark
#   size: sm (36px), md (44px) or lg (52px)
#   block: Fill the width of the container
#   disabled: Disabled
#   type: button, submit or reset
#   icon: Lucide icon name
#   icon_position: left or right
#   sr_suffix: Extra words for screen readers, naming the target
slots:
  content: { title: 'Label markup, used in place of the label prop' }
