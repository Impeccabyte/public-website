name: Gallery
description: 'A main product image with thumbnail buttons that switch it.'
# Props, all optional unless the template needs them. They are documented
# here instead of in a schema because most take values of more than one type
# (a string or nothing, a list or a rendered element).
#   id: Unique id prefix
#   name: Device name
#   images: List of {url, alt, label}
#   shape: Placeholder shape when there are no images
libraryOverrides:
  dependencies:
    - core/drupal
    - core/once
