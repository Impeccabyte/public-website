name: Savings estimator
description: 'A slider for monthly card sales and a table estimating monthly cost under each pricing program.'
# Props, all optional unless the template needs them. They are documented
# here instead of in a schema because most take values of more than one type
# (a string or nothing, a list or a rendered element).
#   id: Section id
#   anchor: Anchor id
#   eyebrow: Eyebrow
#   heading: Heading
#   intro: Intro
#   assumptions: Assumptions text
#   flat_percent: Flat rate percent
#   flat_cents: Flat rate cents per sale
#   ic_percent: Interchange plus effective percent
#   ic_cents: Interchange plus cents per sale
#   avg_ticket: Average ticket
#   dp_fee: Monthly dual pricing fee
#   default_volume: Starting monthly card sales
#   show_prices: Whether prices are shown
#   price_placeholder: Placeholder text
#   quote_url: Quote form path
libraryOverrides:
  dependencies:
    - core/drupal
    - core/once
    - core/components.impeccabyte--price
    - core/components.impeccabyte--badge
    - core/components.impeccabyte--button
