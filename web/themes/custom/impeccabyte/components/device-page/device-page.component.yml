name: Device page
description: 'The full device page: gallery, lease or buy choice, features, specs, gateways, documents and related devices.'
# Props, all optional unless the template needs them. They are documented
# here instead of in a schema because most take values of more than one type
# (a string or nothing, a list or a rendered element).
#   nid: Node id
#   title: Device name
#   breadcrumb: Breadcrumb items
#   manufacturer: Manufacturer {label}
#   device_type: Device type {label}
#   in_stock: In stock
#   dual_pricing_ready: Dual pricing ready
#   summary: Summary
#   gallery: Images {url, alt}
#   shape: Placeholder shape
#   lease: Formatted lease price
#   buy: Formatted buy price
#   lease_terms: Lease terms
#   buy_terms: Buy terms
#   fees: Monthly fees {label, amount}
#   key_features: Feature list
#   specs: Spec rows {label, spec_value}
#   gateways: Gateways {icon, title, body}
#   gateway_note: Gateway note
#   documents: Documents {label, url, mime, size}
#   related: Rendered related device cards
#   show_prices: Whether prices are shown
#   price_placeholder: Placeholder text
#   quote_url: Quote form path
libraryOverrides:
  dependencies:
    - core/components.impeccabyte--card
    - core/components.impeccabyte--price
