name: Device page
description: 'The full device page: gallery, lease or buy choice, features, specs, gateways, documents and related devices.'
props:
  type: object
  properties:
    nid: { title: 'Node id' }
    title: { title: 'Device name' }
    breadcrumb: { title: 'Breadcrumb items' }
    manufacturer: { title: 'Manufacturer {label}' }
    device_type: { title: 'Device type {label}' }
    in_stock: { title: 'In stock' }
    dual_pricing_ready: { title: 'Dual pricing ready' }
    summary: { title: 'Summary' }
    gallery: { title: 'Images {url, alt}' }
    shape: { title: 'Placeholder shape' }
    lease: { title: 'Formatted lease price' }
    buy: { title: 'Formatted buy price' }
    lease_terms: { title: 'Lease terms' }
    buy_terms: { title: 'Buy terms' }
    fees: { title: 'Monthly fees {label, amount}' }
    key_features: { title: 'Feature list' }
    specs: { title: 'Spec rows {label, spec_value}' }
    gateways: { title: 'Gateways {icon, title, body}' }
    gateway_note: { title: 'Gateway note' }
    documents: { title: 'Documents {label, url, mime, size}' }
    related: { title: 'Rendered related device cards' }
    show_prices: { title: 'Whether prices are shown' }
    price_placeholder: { title: 'Placeholder text' }
