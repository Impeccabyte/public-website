name: Section header
description: 'Eyebrow, heading and intro for a section, with an optional link beside it.'
props:
  type: object
  properties:
    eyebrow: { title: 'Eyebrow' }
    heading: { title: 'Heading' }
    intro: { title: 'Intro text or markup' }
    link_label: { title: 'Link label' }
    link_url: { title: 'Link target' }
    heading_level: { title: 'Heading level, 2 by default' }
    heading_id: { title: 'Id for the heading, so a section can be labelled by it' }
    align: { title: 'left or center' }
