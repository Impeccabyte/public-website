name: Section header
description: 'Eyebrow, heading and intro for a section, with an optional link beside it.'
# Props, all optional unless the template needs them. They are documented
# here instead of in a schema because most take values of more than one type
# (a string or nothing, a list or a rendered element).
#   eyebrow: Eyebrow
#   heading: Heading
#   intro: Intro text or markup
#   link_label: Link label
#   link_url: Link target
#   heading_level: Heading level, 2 by default
#   heading_id: Id for the heading, so a section can be labelled by it
#   align: left or center
