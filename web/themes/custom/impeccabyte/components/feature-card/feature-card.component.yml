name: Feature card
description: 'A card with an icon tile, title, body and a link label. The whole card is the link.'
# Props, all optional unless the template needs them. They are documented
# here instead of in a schema because most take values of more than one type
# (a string or nothing, a list or a rendered element).
#   icon: Lucide icon name
#   title: Title
#   body: Body
#   link: Link {url, title}
#   highlight: Brand-tinted card
#   heading_level: Heading level, 3 by default
libraryOverrides:
  dependencies:
    - core/components.impeccabyte--card
