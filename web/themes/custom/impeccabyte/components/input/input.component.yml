name: Input
description: 'A labelled text input with optional hint and error.'
# Props, all optional unless the template needs them. They are documented
# here instead of in a schema because most take values of more than one type
# (a string or nothing, a list or a rendered element).
#   id: Element id
#   name: Field name
#   label: Visible label
#   type: Input type
#   value: Value
#   placeholder: Placeholder
#   hint: Hint under the label
#   error: Error message
#   required: Required
#   prefix: Text before the value, such as $
#   suffix: Text after the value, such as %
#   autocomplete: Autocomplete token
#   inputmode: Input mode
#   on_dark: On a dark surface
#   hide_label: Hide the label visually
#   size: md (44px) or lg (52px)
