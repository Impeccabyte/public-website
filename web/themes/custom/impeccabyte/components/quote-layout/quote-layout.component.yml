name: Quote layout
description: 'The quote page: heading, the form in a card and the reassurance sidebar.'
# Props, all optional unless the template needs them. They are documented
# here instead of in a schema because most take values of more than one type
# (a string or nothing, a list or a rendered element).
#   eyebrow: Eyebrow
#   heading: Headline
#   accent_word: Word set in italic clay
#   intro: Lead
#   form: Rendered form
#   phone: Phone number
#   hours: Phone hours
#   points: Reassurance points {icon, title, body}
#   quote: Sidebar quote {text, source, placeholder}
libraryOverrides:
  dependencies:
    - core/components.impeccabyte--webform-embed
    - core/components.impeccabyte--badge
