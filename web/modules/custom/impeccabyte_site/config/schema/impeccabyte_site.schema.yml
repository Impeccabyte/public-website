impeccabyte_site.settings:
  type: config_object
  label: 'Impeccabyte site settings'
  mapping:
    show_prices:
      type: boolean
      label: 'Show prices'
    price_placeholder:
      type: label
      label: 'Text shown in place of a price'
    quote_path:
      type: string
      label: 'Path of the quote form'
    phone:
      type: label
      label: 'Phone number'
    hours:
      type: label
      label: 'Phone hours'
    email:
      type: email
      label: 'Contact email'
    address_line1:
      type: label
      label: 'Street address'
    address_line2:
      type: label
      label: 'City, state and ZIP'
    login_url:
      type: uri
      label: 'Merchant app address'
    disclosure:
      type: text
      label: 'Footer disclosure'
    forms_base_url:
      type: uri
      label: 'Address of the app that serves the embedded quote form'
    quote_form_id:
      type: string
      label: 'Embedded quote form ID'
    service_area:
      type: sequence
      label: 'Service area'
      sequence:
        type: label
        label: 'City'

webform.webform.third_party.impeccabyte_site:
  type: mapping
  label: 'Impeccabyte site settings for a webform'
  mapping:
    meta_description:
      type: text
      label: 'Search description for the form page'
